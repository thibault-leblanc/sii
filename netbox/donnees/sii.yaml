# Export de NetBox par netbox/outils/exporter.py. NetBox fait foi : modifier NetBox,
# puis relancer l'export. Les points à vérifier (a_verifier) ne vivent pas dans NetBox.
a_verifier:
- 'Pare-feu : fabricant, modèle et noms réels des interfaces (wan, vlan10, vlan20, vlan30).'
- 'Clients FTP réels des VLAN20 et VLAN30 : aucun n''est déclaré.'
- Système et modèle du poste d'administration.
site:
  nom: SII Lab
  slug: sii-lab
dns:
- 1.1.1.1
- 8.8.8.8
vlans:
  10:
    nom: VLAN10
    description: Réseau Infrastructure & Administration
    prefixe: 192.168.10.0/24
  20:
    nom: VLAN20
    description: Réseau Terrain (Modbus/IO) CIM1-CIM2
    prefixe: 192.168.20.0/24
    plage_macvlan: 192.168.20.16/28
  30:
    nom: VLAN30
    description: Réseau Supervision (OPC-UA/SCADA) CIM2-CIM3
    prefixe: 192.168.30.0/24
    plage_macvlan: 192.168.30.16/28
roles:
  commutateur:
    nom: Commutateur
    couleur: 2196f3
  conteneur:
    nom: Conteneur
    couleur: ff9800
    vm: true
  noeud-fonctionnel:
    nom: Nœud fonctionnel
    couleur: 4caf50
  noeud-infra:
    nom: Nœud infra
    couleur: 9c27b0
  pare-feu:
    nom: Pare-feu
    couleur: f44336
  poste-admin:
    nom: Poste d'administration
    couleur: 607d8b
plateformes:
  ubuntu-26-04: Ubuntu Server 26.04
types:
  pare-feu-a-verifier:
    fabricant: A vérifier
    modele: Pare-feu (à vérifier)
  dgs-1210-10mp:
    fabricant: D-Link
    modele: DGS-1210-10MP
  pc-generique:
    fabricant: Générique
    modele: PC
  rpi-3b:
    fabricant: Raspberry Pi
    modele: Raspberry Pi 3 Model B
  rpi-5:
    fabricant: Raspberry Pi
    modele: Raspberry Pi 5
clusters:
  conduite: 'Fonction de conduite : SCADA. pi51 aujourd''hui, pi52 demain.'
  fonctionnel: 'Porte le métier : automates, simulations.'
  infra: 'Services de socle : données de la plateforme, gestion HA et conteneurs.'
equipements:
  commutateur:
    type: dgs-1210-10mp
    role: commutateur
    description: Distribution
    interfaces:
      gestion:
        type: virtual
        vlan: 10
        ip: 192.168.10.90/24
        principale: true
      port3:
        vlans:
        - 10
        - 20
        - 30
        description: trunk pi31
      port4:
        vlans:
        - 10
        - 20
        - 30
        description: trunk pi32
      port5:
        vlans:
        - 10
        - 20
        - 30
        description: trunk pi51
      port6:
        vlan: 10
        description: pare-feu VLAN10
      port7:
        vlan: 20
        description: pare-feu VLAN20
      port8:
        vlan: 30
        description: pare-feu VLAN30
  pare-feu:
    type: pare-feu-a-verifier
    role: pare-feu
    description: Segmentation infrastructure / extérieur, passerelle de chaque VLAN
    interfaces:
      vlan10:
        vlan: 10
        ip: 192.168.10.1/24
        cable: commutateur/port6
      vlan20:
        vlan: 20
        ip: 192.168.20.1/24
        cable: commutateur/port7
      vlan30:
        vlan: 30
        ip: 192.168.30.1/24
        cable: commutateur/port8
      wan:
        ip: 192.168.1.200/24
  pi31:
    type: rpi-3b
    role: noeud-fonctionnel
    plateforme: ubuntu-26-04
    clusters:
    - fonctionnel
    description: Hôte de calcul Edge (actif)
    contexte:
      racine_projets: /home/pi31
      stockage_persistant: /home/pi31/donnees
    interfaces:
      eth0:
        vlans:
        - 10
        - 20
        - 30
        cable: commutateur/port3
      eth0.10:
        parent: eth0
        vlan: 10
        ip: 192.168.10.10/24
        principale: true
      eth0.20:
        parent: eth0
        vlan: 20
      eth0.30:
        parent: eth0
        vlan: 30
    ports:
      ssh:
        proto: tcp
        ports:
        - 22
        clients:
        - poste-admin
        - sync-vlan-20
        - sync-vlan-30
  pi32:
    type: rpi-3b
    role: noeud-fonctionnel
    plateforme: ubuntu-26-04
    clusters:
    - fonctionnel
    description: Hôte de calcul Edge (relais / passif)
    contexte:
      racine_projets: /home/pi32
      stockage_persistant: /home/pi32/donnees
    interfaces:
      eth0:
        vlans:
        - 10
        - 20
        - 30
        cable: commutateur/port4
      eth0.10:
        parent: eth0
        vlan: 10
        ip: 192.168.10.11/24
        principale: true
      eth0.20:
        parent: eth0
        vlan: 20
      eth0.30:
        parent: eth0
        vlan: 30
    ports:
      ssh:
        proto: tcp
        ports:
        - 22
        clients:
        - poste-admin
        - sync-vlan-20
        - sync-vlan-30
  pi51:
    type: rpi-5
    role: noeud-infra
    plateforme: ubuntu-26-04
    clusters:
    - infra
    - conduite
    description: Stockage central et registre d'images
    contexte:
      racine_projets: /home/pi51
      stockage_persistant: /home/pi51/donnees
    interfaces:
      eth0:
        vlans:
        - 10
        - 20
        - 30
        cable: commutateur/port5
      eth0.10:
        parent: eth0
        vlan: 10
        ip: 192.168.10.12/24
        principale: true
      eth0.20:
        parent: eth0
        vlan: 20
      eth0.30:
        parent: eth0
        vlan: 30
    ports:
      ssh:
        proto: tcp
        ports:
        - 22
        clients:
        - poste-admin
  poste-admin:
    type: pc-generique
    role: poste-admin
    description: 'Poste d''administration, côté WAN du pare-feu (réseau de la box) : NetBox, construction des images, FUXA
      de développement (scada-dev)'
    interfaces:
      eth0:
        ip: 192.168.1.26/24
        principale: true
        description: Réseau de la box (192.168.1.0/24), routes vers les VLAN par 192.168.1.200
    ports:
      fuxa:
        proto: tcp
        ports:
        - 1881
        description: FUXA de développement (conteneur scada-dev du poste), hors plateforme
vrrp:
  coeur-sii:
    vrid: 51
    vip: 192.168.10.251/24
    interface: eth0.10
    membres:
      pi31: 100
      pi32: 90
services:
  api-rincage:
    cluster: fonctionnel
    ha: true
    description: Automate de contrôle et serveur OPC-UA
    source: configurations/conteneurs/api/rincage
    chemin: api/rincage
    passerelle: vlan30
    fichiers:
      config_api.json: configurations/conteneurs/api/rincage/config_api.json
    ip:
      vlan20: 192.168.20.20/24
      vlan30: 192.168.30.20/24
    compose:
      image: api-rincage-image:latest
      restart: 'no'
      service: api_rincage
      volumes:
      - ./config_api.json:/app/config_api.json
      container_name: api-rincage
    ports:
      opcua:
        proto: tcp
        ports:
        - 4840
        ip: 192.168.30.20/24
        clients:
        - poste-admin
        - scada
  donnees-vlan-20:
    cluster: infra
    description: Serveur FTP, ingestion du réseau terrain
    source: configurations/conteneurs/donnees/serveur
    chemin: donnees-vlan-20
    ip:
      vlan20: 192.168.20.30/24
    compose:
      image: serveur-ftp:latest
      restart: unless-stopped
      service: donnees-vlan-20
      volumes:
      - /home/pi51/donnees/vlan20:/partage
      environment:
      - FTP_USER=admin
      - FTP_PASS=${FTP_PASS:?definir FTP_PASS dans .env}
      container_name: donnees-vlan-20
    ports:
      ftp:
        proto: tcp
        ports:
        - 21
        - 21000-21010
  donnees-vlan-30:
    cluster: infra
    description: Serveur FTP, ingestion du réseau de supervision
    source: configurations/conteneurs/donnees/serveur
    chemin: donnees-vlan-30
    ip:
      vlan30: 192.168.30.30/24
    compose:
      image: serveur-ftp:latest
      restart: unless-stopped
      service: donnees-vlan-30
      volumes:
      - /home/pi51/donnees/vlan30:/partage
      environment:
      - FTP_USER=admin
      - FTP_PASS=${FTP_PASS:?definir FTP_PASS dans .env}
      container_name: donnees-vlan-30
    ports:
      ftp:
        proto: tcp
        ports:
        - 21
        - 21000-21010
  ha-cluster:
    cluster: fonctionnel
    description: Agent de haute disponibilité (keepalived), réseau de l'hôte
    source: configurations/conteneurs/cluster
    chemin: ha-cluster
    compose:
      image: agent-ha:latest
      restart: unless-stopped
      service: ha-cluster
      volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/config:ro
      - ../.agent-ha:/etat
      privileged: true
      network_mode: host
      container_name: ha-cluster
      stop_grace_period: 30s
  registre:
    cluster: infra
    description: Registre d'images local (HTTP, sans authentification jusqu'à la GIA)
    source: configurations/conteneurs/registre
    chemin: registre
    compose:
      image: registry:3.1.2
      ports:
      - 192.168.10.12:5000:5000
      restart: unless-stopped
      service: registre
      volumes:
      - ./data:/var/lib/registry
      container_name: registre
    ports:
      http:
        proto: tcp
        ports:
        - 5000
        clients:
        - pi31
        - pi32
        - poste-admin
        description: API du registre (envoi depuis le poste, tirage par les nœuds)
  scada:
    cluster: conduite
    description: SCADA FUXA (IHM de conduite), client OPC-UA de l'automate
    source: configurations/conteneurs/scada
    chemin: scada
    amorcage:
      appdata/settings.js: configurations/conteneurs/scada/donnees/settings.js
      appdata/mysettings.json: configurations/conteneurs/scada/donnees/mysettings.json
      appdata/project.fuxap.db: configurations/conteneurs/scada/donnees/project.fuxap.db
    ip:
      vlan30: 192.168.30.10/24
    compose:
      image: scada-fuxa:1.3.3
      restart: unless-stopped
      service: scada
      volumes:
      - ./appdata:/usr/src/app/FUXA/server/_appdata
      container_name: scada
    ports:
      ihm:
        proto: tcp
        ports:
        - 1881
        clients:
        - poste-admin
        description: Interface web FUXA
  sim-rincage:
    cluster: fonctionnel
    ha: true
    description: Simulation physique du tambour de rinçage
    source: configurations/conteneurs/sim/rincage
    chemin: simulation/rincage
    fichiers:
      config_simu.json: configurations/conteneurs/sim/rincage/config_simu.json
    ip:
      vlan20: 192.168.20.10/24
    compose:
      image: simu-rincage-image:latest
      restart: 'no'
      service: simulateur_acide
      volumes:
      - ./config_simu.json:/app/config_simu.json
      container_name: sim-rincage
    ports:
      modbus:
        proto: tcp
        ports:
        - 502
        clients:
        - api-rincage
  sync-vlan-20:
    cluster: infra
    description: Agent rsync, réplication du VLAN20 vers le cluster fonctionnel
    source: configurations/conteneurs/donnees/agent-sync
    chemin: agent-sync/sync-vlan-20
    ip:
      vlan20: 192.168.20.31/24
    compose:
      image: agent-sync:latest
      restart: unless-stopped
      service: sync-vlan-20
      volumes:
      - /home/pi51/donnees/vlan20/donnees:/donnees:ro
      - /home/pi51/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      environment:
      - VLAN_CIBLE=vlan20
      container_name: sync-vlan-20
  sync-vlan-30:
    cluster: infra
    description: Agent rsync, réplication du VLAN30 vers le cluster fonctionnel
    source: configurations/conteneurs/donnees/agent-sync
    chemin: agent-sync/sync-vlan-30
    ip:
      vlan30: 192.168.30.31/24
    compose:
      image: agent-sync:latest
      restart: unless-stopped
      service: sync-vlan-30
      volumes:
      - /home/pi51/donnees/vlan30/donnees:/donnees:ro
      - /home/pi51/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      environment:
      - VLAN_CIBLE=vlan30
      container_name: sync-vlan-30
