# Généré par netbox/outils/generer.py depuis NetBox. Ne pas modifier à la main.
name: sync-vlan-30
services:
  sync-vlan-30:
    image: agent-sync:latest
    container_name: sync-vlan-30
    restart: unless-stopped
    environment:
    - VLAN_CIBLE=vlan30
    volumes:
    - /home/pi51/donnees/vlan30/donnees:/donnees:ro
    - /home/pi51/.ssh/id_rsa:/root/.ssh/id_rsa:ro
    networks:
      vlan30:
        ipv4_address: 192.168.30.31
networks:
  vlan30:
    external: true
